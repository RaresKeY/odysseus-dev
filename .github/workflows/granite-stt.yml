name: Granite STT

on:
  pull_request:
    paths:
      - '.github/workflows/granite-stt.yml'
      - 'services/stt/**'
      - 'routes/stt_routes.py'
      - 'src/agent_tools/media_tools.py'
      - 'src/constants.py'
      - 'src/tool_schemas.py'
      - 'src/tool_index.py'
      - 'tests/test_tool_index_schema_parity.py'
      - 'requirements-stt-granite.txt'
      - 'tests/test_granite_stt.py'
      - 'tests/test_transcribe_cpp_stt.py'
      - 'tests/test_prepare_granite_cpp.py'
      - 'scripts/prepare_granite_cpp.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: granite-stt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  granite-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install CPU inference dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg ca-certificates
          python scripts/check_ca_trust.py --system
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements-bootstrap.txt
          python scripts/check_ca_trust.py --python
          python -m pip install 'torch>=2.6,<3' 'torchaudio>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-stt-granite.txt 'transformers==5.16.0'
      - name: Focused transcription regressions
        run: |
          python -m pytest -q tests/test_granite_stt.py tests/test_transcribe_cpp_stt.py tests/test_prepare_granite_cpp.py tests/test_stt_leak.py tests/test_speech_service_toggles.py tests/test_tool_index_schema_parity.py
          python -m pytest -q tests/test_inspect_media_tool.py -k transcribe
      - name: Real CPU transcription through the STT route
        env:
          HF_HOME: ${{ runner.temp }}/granite-hf
          ODYSSEUS_GRANITE_SMOKE_AUDIO: ${{ runner.temp }}/jfk.wav
        run: |
          curl --fail --location --retry 3 --max-time 60 \
            https://raw.githubusercontent.com/ggml-org/whisper.cpp/7e1059232546cab989b6c19716dc88b16d018a87/samples/jfk.wav \
            --output "$ODYSSEUS_GRANITE_SMOKE_AUDIO"
          python -m pytest -q -s tests/test_granite_stt.py -k real_cpu


  granite-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install native build and conversion dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg cmake g++ libopenblas-dev ca-certificates
          python scripts/check_ca_trust.py --system
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements-bootstrap.txt
          python scripts/check_ca_trust.py --python
          python -m pip install 'torch>=2.6,<3' 'torchaudio>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-stt-granite.txt 'transformers==5.16.0' 'gguf>=0.10' 'huggingface-hub>=0.30' 'safetensors>=0.4'
      - name: Build pinned transcribe.cpp
        run: |
          git clone --filter=blob:none https://github.com/handy-computer/transcribe.cpp.git "$RUNNER_TEMP/transcribe-cpp"
          git -C "$RUNNER_TEMP/transcribe-cpp" checkout --detach 5700f127e38dd53c4735ea23ef743b4b538eacd4
          git -C "$RUNNER_TEMP/transcribe-cpp" submodule update --init --recursive
          cmake -S "$RUNNER_TEMP/transcribe-cpp" -B "$RUNNER_TEMP/transcribe-cpp/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/transcribe-cpp/build" --target transcribe-cli -j 2
      - name: Convert pinned multilingual IBM checkpoint
        env:
          HF_HOME: ${{ runner.temp }}/granite-hf
        run: |
          python scripts/prepare_granite_cpp.py             --transcribe-source "$RUNNER_TEMP/transcribe-cpp"             --outdir "$RUNNER_TEMP/granite-native"
      - name: Real native CPU transcription through STT route
        env:
          ODYSSEUS_GRANITE_ENGINE: transcribe.cpp
          ODYSSEUS_TRANSCRIBE_CPP_BACKEND: cpu
          ODYSSEUS_NATIVE_GRANITE_SMOKE_AUDIO: ${{ runner.temp }}/jfk.wav
        run: |
          curl --fail --location --retry 3 --max-time 60             https://raw.githubusercontent.com/ggml-org/whisper.cpp/7e1059232546cab989b6c19716dc88b16d018a87/samples/jfk.wav             --output "$ODYSSEUS_NATIVE_GRANITE_SMOKE_AUDIO"
          export ODYSSEUS_TRANSCRIBE_CPP_BIN="$RUNNER_TEMP/transcribe-cpp/build/bin/transcribe-cli"
          export ODYSSEUS_GRANITE_GGUF
          ODYSSEUS_GRANITE_GGUF="$(find "$RUNNER_TEMP/granite-native" -maxdepth 1 -name '*.gguf' -print -quit)"
          test -n "$ODYSSEUS_GRANITE_GGUF"
          python -m pytest -q -s tests/test_transcribe_cpp_stt.py -k native_real_model
